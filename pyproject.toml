[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-transcriber"
version = "1.2.1"
description = "Arc: one streaming model for transcript, inline name / number tags, speakers, tags, events and device-directed speech (Arc Mini 1.1.1 or Arc Transcriber 1.2.0)"
readme = "README.md"
license = {text = "CC-BY-NC-4.0 with the Whissle terms in LICENSE; non-commercial use only; commercial licences from Whissle Inc."}
authors = [{name = "Whissle Inc.", email = "ksingla@whissle.ai"}]
requires-python = ">=3.10"
# tested: torch 2.11, transformers 5.19 (Moonshine Streaming + Parakeet encoder support)
dependencies = ["torch>=2.1", "transformers>=5.19", "safetensors", "numpy", "soundfile", "huggingface_hub", "rapidfuzz", "jellyfish", "num2words"]

[project.optional-dependencies]
live = ["websockets>=12", "sounddevice"]    # --asr deepgram/verbit --live, --mic
resample = ["scipy"]
test = ["pytest>=8"]

[project.scripts]
arc-transcribe = "arc_transcriber.cli:main"

[tool.setuptools]
packages = ["arc_audio", "arc_audio.seq", "arc_transcriber"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]                # the checkout, not an installed copy
